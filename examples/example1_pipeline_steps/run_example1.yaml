
#------------------------------ General ------------------------------#



# Working directory (where the pipeline will be run)
wd: ""


# SLiMs-related options
slims:
  
  # Options to be used in writing the output data frames
  # containing the SLiMs
  out:

    # Field separator
    sep: ","

    # Whether to write the data frame's index
    index: False



#---------------------------- Structures -----------------------------#



# Settings to be used for the structures
structures:

  # Minimum length (in number of residues) that a disordered region
  # needs to be to be considered a true disordered region
  min_len_disorder: 10

  # Name of the directory where to save the structures, if at least
  # one SLiM of interest is found in them
  struct_dir: structures


  #-------------- Structures of the protein in the PDB ---------------#


  # Settings for the data frame that will contain the structures
  # of the protein of interest (if available) and for the output
  # file that will contain the data frame
  protein:
    
    # Data frame settings
    df:
      
      # Sort the data frame
      sort:
        
        # Sorting criteria (will be applied in order)
        sort_by:
          - "resolution"
          - "deposition_date"
        
        # Whether, for each sorting criterion, to sort in ascending
        # order (if False, descending order will be used)
        ascending:
          - True
          - False
    
    # Output CSV settings (will be passed to DataFrame.to_csv())
    out:

      # Field separator
      sep: ","

      # Whether to write the data frame's index
      index: False

      # How to format dates (for example, for the deposition date
      # of a structure)
      date_format: "%Y/%m/%d"


  #--------- Structures of the protein in the AlphaFold DB ----------#


  # Settings for the data frame containing the AlphaFold structures
  # and for the output file that will contain the data frame
  alphafold:

    # Data frame settings
    df:

      # Sort the data frame
      sort:
        
        # Sorting criteria (will be applied in order)
        sort_by:
          - "struct_version"

        # Whether, for each sorting criterion, to sort in ascending
        # order (if False, descending order will be used)
        ascending:
          - False
    
      # Filter the data frame
      filter:
        
        # Which version(s) of the structure to keep in the
        # data frame
        struct_version_in:
          - 1
          - 2
          - 3

    # Output CSV settings (will be passed to DataFrame.to_csv())
    out:

      # Field separator
      sep: ","

      # Whether to write the data frame's index
      index: False

      # How to format dates (for example, for the deposition date
      # of a structure)
      date_format: "%Y/%m/%d"


  #-------------- Structures of the homologs in the PDB --------------#


  # Settings for the data frame that will contain the structures
  # of the homologs found for the protein of interest and for the
  # output file that will contain the data frame
  homolog:
    
    # Data frame settings
    df:
      
      # Sort the data frame
      sort:
        
        # Sorting criteria (will be applied in order)
        sort_by:
          - "identities"
          - "resolution"
          - "deposition_date"
        
        # Whether, for each sorting criterion, to sort in ascending
        # order (if False, descending order will be used)
        ascending:
          - False
          - True
          - False
    
      # Filter the data frame
      filter:
        
        # Only homologs covering a portion of the protein of
        # interest higher than this threshold will be kept
        min_identities: 30
        
        # Only homologs covering a portion of the protein of
        # interest higher than this threshold will be kept
        min_uniprot_coverage_percent: 10

    # Output CSV settings (will be passed to DataFrame.to_csv())
    out:

      # Field separator
      sep: ","

      # Whether to write the data frame's index
      index: False

      # How to format dates (for example, for the deposition date
      # of a structure)
      date_format: "%Y/%m/%d"

    # Available filters (can represent an exact value or a
    # minimum/maximum for numeric fields, if prefixed with
    # min_/max_) are:

    # prob, e_value, p_value, score, identities, similarity,
    # sum_probs, template_neff, organism, uniprot_coverage_percent,
    # method, resolution, deposition_date



#-------------------------- HHpred pipeline --------------------------#



# HHblits settings
hhblits:
  
  # Run options
  run:
    
    # Path to the executable
    executable: "/usr/local/hh-suite/build/bin/hhblits"
    
    # Name of the directory where to run HHblits (if it is an empty
    # string, it will be run in the pipeline's working directory)
    wd: "hhpred"
    
    # Name of the output file where the log of the run will be stored
    outfile: "hhblits.log"
    
    # HHblits options
    options:
      -d: "/data/databases/hh-suite-20210225/UniRef30_2020_06"


# HHsearch settings
hhsearch:
  
  # Run options
  run:
    
    # Path to the executable
    executable: "/usr/local/hh-suite/build/bin/hhsearch"
    
    # Name of the directory where to run HHsearch (if it is an empty
    # string, it will be run in the pipeline's working directory)
    wd: "hhpred"
    
    # Name of the output file where the log of the run will be stored
    outfile: "hhsearch.log"
    
    # HHsearch options
    options:

      ## Defaults used by hhsearch on the HHpred server
      ## as of Feb 24th 2021

      ## Descriptions of the options are taken from the HHsuite
      ## user guide

      # HMM database of concatenated HMMs in hhm, HMMER, or A3M format,
      # or, if the file has extension pal, list of HMM file names, 
      # one per line. 
      # Multiple dbs, HMMs, or pal files with -d ’<db1> <db2>...’
      -d: "/data/databases/hh-suite-20210225/pdb70"
      
      # Maximum number of query/template sequences displayed
      # (default: 1)
      -seq: 1
      
      # Minimum probability in summary and alignment list (default: 20)
      -p: 20
      
      # Maximum number of lines in summary hit list (default: 500)
      -Z: 250
      
      # Minimum number of lines in summary hit list (default: 10)
      -z: 1
      
      # Maximum number of alignments in alignment list (default: 500)
      -B: 250
      
      # Minimum number of alignments in alignment list (default: 10)
      -b: 1
      
      # Max length of database string to be printed in the HHR
      # (standard format) file
      -dbstrlen: 10000
      
      # Do NOT realign displayed hits with MAC algorithm
      # (default: realign)
      -norealign: True
      
      # Use local alignment mode for searching/ranking
      -loc: True
      
      # Amino acid score (tja: template HMM at column j) (default: 1)
      # 0 = log2 Sum(tja*qia/pa) (pa: aa background frequencies)
      # 1 = log2 Sum(tja*qia/pqa) (pqa = 1/2*(pa+ta) )
      # 2 = log2 Sum(tja*qia/ta) (ta: av. aa freqs in template)﻿
      # 3 = log2 Sum(tja*qia/qa) (qa: av. aa freqs in query)
      # 5 = local amino acid composition correction
      -sc: 1
      
      # Secondary structure score (default: 2)
      # 0 = no ss scoring﻿
      # 1,2 = ss scoring after or during alignment
      # 3,4 = ss scoring after or during alignment, predicted vs. predicted
      -ssm: 2
      
      # Context file for computing context-specific pseudocounts
      -contxt: "/usr/local/hh-suite/data/context_data.crf"
      
      # Max number of HMM columns (default: 15002)
      -maxres: 32000



#------------------------------- DSSP --------------------------------#



# DSSP settings
dssp:
  
  # Run options
  run:
    
    # Path to the executable
    executable: "/usr/local/dssp-3.0.10/bin/mkdssp"
    
    # Name of the directory where to run DSSP for each PDB structure
    # (if it is an empty string, it will be run in the pipeline's
    # working directory)
    wd: "dssp"
    
    # DSSP options (empty dictionary if no option is passed)
    options: {}
  
  # Processing options for the DSSP output
  processing:
    
    # Mapping of DSSP symbols to custom symbols
    dssp_mapping:
      G: "H"
      I: "H"
      H: "H"
      B: "-"
      S: "-"
      E: "E"
      T: "-"
    
    # How to represent unstructures residues (represented by
    # whitespaces in DSSP outputs) in the FASTA-like DSSP
    # sequence
    whitespace_repr: "-"
    
    # Which symbols of the DSSP mapping represent disordered residues
    disorder_symbols:
      - "-"
